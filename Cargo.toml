[package]
name = "devsweep"
version = "0.1.0"
edition = "2021"
authors = ["Gabriel Cerqueira"]
description = "Fast, safe disk cleaner and visualizer for developer build caches and artifacts."
readme = "README.md"
repository = "https://github.com/Gabriel-Cerqueira/devsweep"
license = "MIT"

[dependencies]
ratatui = "0.29.0"
crossterm = "0.28.1"
clap = { version = "4.5.31", features = ["derive"] }
rayon = "1.10.0"
jwalk = "0.8.1"
trash = "5.2.2"
chrono = "0.4.40"
anyhow = "1.0.97"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
